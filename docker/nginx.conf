server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/nwv/headers.conf;
    include /tmp/nwv/csp.conf;   # generated at start by 40-runtime-config.sh

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime config written at container start (works with a read-only filesystem)
    location = /config.js {
        alias /tmp/nwv/config.js;
        default_type application/javascript;
        include /etc/nginx/nwv/headers.conf;
        include /tmp/nwv/csp.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build output
    location /assets/ {
        include /etc/nginx/nwv/headers.conf;
        include /tmp/nwv/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/nwv/headers.conf;
        include /tmp/nwv/csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
