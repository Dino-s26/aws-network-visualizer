# Static security headers. Included in every location because nginx
# add_header in a location replaces the headers inherited from the server block.
# HSTS belongs on the TLS terminator (load balancer / reverse proxy), not here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
